server:
  port: 8081
spring:
  application:
    name: "Requests-ms"
  r2dbc:
    url: "r2dbc:postgresql://localhost:5432/crediya_loans"
    username: "postgres"
    password: "admin"
  devtools:
    add-properties: false
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: "1ADDFHEUKQ718327ajdhdj28aueyrhdf74k"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
adapter:
  restconsumer:
    timeout: 5000
    url: "http://localhost:8080"
  sqs:
    region: "us-east-1"
    queues:
      loanRequests: "https://sqs.us-east-1.amazonaws.com/825351789212/loan-requests.fifo"
      autoVerification: "https://sqs.us-east-1.amazonaws.com/825351789212/autoverification-loan.fifo"
      updateState: "https://sqs.us-east-1.amazonaws.com/825351789212/actualizacion-estado"
resilience4j:
  circuitbreaker:
    instances:
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
